.steps{display:flex;gap:6px;margin-top:12px;font-size:12px}

.sheet{background:#fff;width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}

label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px}
.bank{background:var(--g2);border-radius:12px;padding:12px;margin-top:14px}

.bank img{width:200px;max-width:70%;display:block;margin:10px auto 0;border-radius:8px;background:#fff}

.note{font-size:12px;color:var(--mut)}

ol{padding-left:20px;margin:8px 0;font-size:14px}

  else{if(curCat==="all"&&!q&&BEST.length)h+=`<div class="sec hot"><h2>🔥 ຂາຍດີ TOP 10 Olive Young</h2><span>ອັນດັບຂາຍດີໃນເກົາຫຼີ</span></div><div class="grid">${rk(BEST)}</div>`;
  for(const [k,l] of used){const G=L.filter(p=>catOf(p)===k);if(G.length)h+=`<div class="sec"><h2>${l}</h2><span>${G.length} ລາຍການ</span></div><div class="grid">${G.map(card).join("")}</div>`}}
  $("#grid").innerHTML=h;if(DB)hydrate();
  const n=lines().reduce((a,l)=>a+l.q,0);
  $("#bar").innerHTML=n?`<div class="bar"><div>🛒 ${n} ອັນ<b>${fm(total())} ກີບ</b></div><button class="btn" data-a="checkout">ສັ່ງຊື້ →</button></div>`:"";
}
function msgText(){
  const L=lines();
  const tag={v:1,n:form.n.trim(),p:form.p.trim(),m:form.m.trim(),t:total(),i:L.map(l=>[l.p.id,l.p.name,l.q,l.p.sell])};
  return `🛍️ ອໍເດີ Olive Young\nຊື່: ${form.n.trim()}\nເບີ: ${form.p.trim()}\n————\n${L.map(l=>`• ${l.p.name} x${l.q} = ${fm(l.p.sell*l.q)} ກີບ`).join("\n")}\n————${feeT()?`\nລາຄາສິນຄ້າ: ${fm(total()-feeT())} ກີບ\nຄ່າຫິ້ວ (${boxes()} ກ່ອງ): ${fm(feeT())} ກີບ`:""}\nລວມໂອນ: ${fm(total())} ກີບ${form.m.trim()?`\nໝາຍເຫດ: ${form.m.trim()}`:""}\n📎 ຂ້ອຍໂອນເງິນແລ້ວ ຈະສົ່ງສະລິບຕາມມາ\n\n#OY${JSON.stringify(tag)}`;
}
function waHref(){const w=waNum(S.wa);return w?`https://wa.me/${w}?text=${encodeURIComponent(msgText())}`:""}
function checkout(){
  const L=lines();
  $("#layer").innerHTML=`<div class="modal" data-a="bg"><div class="sheet">
  <h2>🛒 ກະຕ່າຂອງທ່ານ</h2>
  ${L.map(l=>`<div class="li"><span>${esc(l.p.name)}<br><b>${fm(l.p.sell*l.q)} ກີບ</b>${feeP(l.p)?`<small class="brk">ສິນຄ້າ ${fm(baseP(l.p)*l.q)} + ຄ່າຫິ້ວ ${fm(feeP(l.p)*l.q)}</small>`:""}</span><div class="qty"><button data-a="m" data-id="${l.p.id}">−</button><b>${l.q}</b><button data-a="p" data-id="${l.p.id}">+</button></div><button class="rmx" data-a="rm" data-id="${l.p.id}" aria-label="ລົບ">✕</button></div>`).join("")}
  ${feeT()?`<div class="sub2"><span>ລາຄາສິນຄ້າ</span><span>${fm(total()-feeT())} ກີບ</span></div><div class="sub2"><span>ຄ່າຫິ້ວ (${boxes()} ກ່ອງ)</span><span>${fm(feeT())} ກີບ</span></div>`:""}
  <div class="tot"><span>ລວມທີ່ຕ້ອງໂອນ</span><span>${fm(total())} ກີບ</span></div>
  <label>ຊື່ຂອງທ່ານ *</label><input id="fn" value="${esc(form.n)}" autocomplete="name">
  <label>ເບີໂທ / WhatsApp *</label><input id="fp" inputmode="tel" value="${esc(form.p)}" autocomplete="tel">
  <label>ໝາຍເຫດ (ສີ, ເບີ, ອື່ນໆ)</label><input id="fm" value="${esc(form.m)}">
  <div class="bank"><b>① ໂອນເງິນ ${fm(total())} ກີບ</b>
    ${S.accNo?`<div style="margin-top:6px">${esc(S.bank)}</div><div class="acc">${esc(S.accNo)} <button class="mini" data-a="copyacc">ກັອບປີ້</button></div><div>${esc(S.accName)}</div>`:`<div style="margin-top:6px">${esc(S.bank||"")} ${S.accName?"· "+esc(S.accName):""}</div><div class="note">ສະແກນ QR ລຸ່ມນີ້ເພື່ອໂອນເງິນ</div>`}
    ${S.qr?`<img src="${S.qr}" alt="QR">`:""}</div>
  <label>② ແນບຮູບສະລິບໂອນເງິນ *</label>
  <label class="slipbox">${slip?`<img src="${slip}" alt="">`:`<span style="font-size:30px">📎</span>`}<span>${slip?"ປ່ຽນຮູບສະລິບ":"ເລືອກຮູບສະລິບ"}</span><input type="file" accept="image/*" id="slipin" hidden></label>
  <div class="err" id="err"></div>
  <button class="btn" style="width:100%;margin-top:12px" data-a="send" ${sending?"disabled":""}>${sending?"ກຳລັງສົ່ງ…":"③ ສົ່ງອໍເດີ"}</button>
  <button class="btn ghost" style="width:100%;margin-top:8px" data-a="close">← ກັບໄປເລືອກເພີ່ມ</button>
  </div></div>`;
  updWa();
}
function doneSheet(){
  const w=waNum(S.wa);const href=w?`https://wa.me/${w}?text=${encodeURIComponent(sent)}`:"";
  $("#layer").innerHTML=`<div class="modal" data-a="bg"><div class="sheet"><div class="done"><b>✅</b><h2>ສົ່ງອໍເດີແລ້ວ</h2><p>ຮ້ານຈະກວດສອບສະລິບ ແລະ ຢືນຢັນອໍເດີໃຫ້ໄວໆນີ້ 🙏</p></div>
  ${href?`<a class="btn wa" href="${href}" target="_blank" rel="noopener">📲 ແຈ້ງຮ້ານທາງ WhatsApp (ບໍ່ບັງຄັບ)</a>`:""}
  <button class="btn ghost" style="width:100%;margin-top:8px" data-a="close">ປິດ</button></div></div>`}
function compress(file,max=1100,limit=330000){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{let q=.75,out;for(let t=0;t<7;t++){const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",q);if(out.length<limit)break;max*=.8;q=Math.max(.45,q-.08)}URL.revokeObjectURL(u);out.length<limit?res(out):rej()};
  img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u})}
function normPhone(p){let d=digits(p);if(d.startsWith("856"))d=d.slice(3);if(d.startsWith("0"))d=d.slice(1);return d}
async function send(){
  if(sending)return;const er=$("#err");er.textContent="";
  if(!ok())return;const ph=normPhone(form.p);
  if(ph.length<8||ph.length>13){er.textContent="ເບີໂທບໍ່ຖືກຕ້ອງ";return}
  if(!slip){er.textContent="ກະລຸນາແນບຮູບສະລິບໂອນເງິນ";return}
  if(!DB){er.textContent="ເຊື່ອມຕໍ່ບໍ່ໄດ້ ລອງໃໝ່ອີກຄັ້ງ";return}
  sending=true;refreshSheet();
  try{
    const auth=firebase.app("shop").auth();if(!auth.currentUser)await auth.signInAnonymously();
    const u=auth.currentUser.uid,pk=ph.slice(-8),day=Math.floor(Date.now()/86400000);
    const ts=firebase.firestore.FieldValue.serverTimestamp();
    const L=lines();const b=DB.batch();
    b.set(DB.collection("pending").doc(),{uid:u,n:form.n.trim().slice(0,60),p:ph,pk,m:form.m.trim().slice(0,300),t:total(),items:L.map(l=>({pid:l.p.id,name:l.p.name,qty:l.q,sell:l.p.sell})),slip,createdAt:ts});
    b.set(DB.doc("limits/"+u),{last:ts});
    b.set(DB.doc("phoneDay/"+pk+"_"+day),{n:firebase.firestore.FieldValue.increment(1),last:ts},{merge:true});
    await b.commit();
    sent=msgText();for(const k in cart)delete cart[k];slip="";form.m="";save();sending=false;render();doneSheet();
  }catch(e){sending=false;refreshSheet();const m=$("#err");
    if(m)m.textContent=e&&e.code==="permission-denied"?"ສັ່ງບໍ່ໄດ້: ກະລຸນາລໍຖ້າ 1 ນາທີ ກ່ອນສັ່ງໃໝ່ ຫຼື ເບີນີ້ສັ່ງຄົບ 3 ຄັ້ງໃນມື້ນີ້ແລ້ວ":"ສົ່ງບໍ່ສຳເລັດ ກະລຸນາລອງໃໝ່ ("+(e&&e.code||"error")+")"}
}
function hydrate(){document.querySelectorAll("img[data-ph]:not([src])").forEach(async im=>{const id=im.dataset.ph;try{if(!PH[id]){const s=await DB.doc("pphotos/"+id).get();PH[id]=s.exists?s.data().d:""}if(PH[id])im.src=PH[id]}catch(e){}})}
function startLive(){try{const APP=firebase.initializeApp(FBCFG,"shop");DB=APP.firestore();
  DB.collection("products").onSnapshot(s=>{const L=s.docs.map(d=>({...d.data(),id:d.id})).filter(p=>Number(p.sell)>0).sort((a,b)=>a.name.localeCompare(b.name));if(L.length){P=L;for(const k in cart)if(!P.find(p=>p.id===k))delete cart[k];render();refreshSheet()}},()=>{});
  DB.doc("settings/shop").onSnapshot(d=>{if(d.exists){S={...S,...d.data()};$("#shop").textContent=S.shopName||"ຮັບຫິ້ວ Olive Young"}},()=>{});
}catch(e){}}
function refreshSheet(){if(!$("#layer").innerHTML||$(".done"))return;if(!lines().length){$("#layer").innerHTML="";return}const sh=$(".sheet"),y=sh?sh.scrollTop:0;checkout();const s2=$(".sheet");if(s2)s2.scrollTop=y}
function updWa(){const a=$("#wa");if(a)a.href=waHref()||"#"}
function ok(){if(!form.n.trim()||digits(form.p).length<6){toast("ກະລຸນາໃສ່ຊື່ ແລະ ເບີໂທ");return false}return true}
document.addEventListener("change",async e=>{if(e.target.id!=="slipin"||!e.target.files.length)return;
  try{slip=await compress(e.target.files[0]);refreshSheet()}catch(err){const m=$("#err");if(m)m.textContent="ເປີດຮູບນີ້ບໍ່ໄດ້ ລອງຮູບອື່ນ"}});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="q")return render();
  if(t.id==="fn")form.n=t.value;if(t.id==="fp")form.p=t.value;if(t.id==="fm")form.m=t.value;save();updWa()});
document.addEventListener("click",async e=>{
  if(e.target.id==="wa"||e.target.closest("#wa")){if(!ok()){e.preventDefault();return}updWa();return}
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==="cat"){curCat=id;render();scrollTo({top:$("#cats").offsetTop-4})}
  else if(a==="p"){cart[id]=(cart[id]||0)+1;save();render();refreshSheet()}
  else if(a==="m"){cart[id]=Math.max(0,(cart[id]||0)-1);if(!cart[id])delete cart[id];save();render();refreshSheet()}
  else if(a==="rm"){delete cart[id];save();render();refreshSheet();toast("ລົບອອກແລ້ວ")}
  else if(a==="checkout")checkout();
  else if(a==="send")send();
  else if(a==="close"||(a==="bg"&&e.target===b)){$("#layer").innerHTML="";render()}
  else if(a==="copyacc"){try{await navigator.clipboard.writeText(S.accNo);toast("ກັອບປີ້ແລ້ວ ✓")}catch(err){toast(S.accNo)}}
  else if(a==="copymsg"){if(!ok())return;const t=msgText();try{await navigator.clipboard.writeText(t);toast("ກັອບປີ້ແລ້ວ ✓ ສົ່ງໃຫ້ຮ້ານທາງແຊັດ")}catch(err){const m=$("#mt");m.style.display="block";m.value=t;m.select();toast("ກົດຄ້າງເພື່ອກັອບປີ້")}}
});
render();startLive();
</script>
</body>
