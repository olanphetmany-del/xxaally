<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ອໍເດີຂອງຂ້ອຍ — ຮັບຫິ້ວ Olive Young</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--g:#1f8a4c;--g2:#e8f5ec;--ink:#1d1d1f;--mut:#6b7280;--line:#e5e7eb;--bg:#f6f7f8;--wa:#25d366;--red:#d93636;--amb:#b7791f}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Lao","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#1f8a4c,#3fb36f);color:#fff;padding:20px 16px 18px}
header h1{margin:0;font-size:21px}header p{margin:4px 0 0;font-size:13px;opacity:.9}
main{padding:14px 12px 40px;max-width:640px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum span{display:block;font-size:12px;color:var(--mut)}.sum b{font-size:16px}
.owe{color:var(--red)}.ok{color:var(--g)}.rf{color:var(--amb)}
.oh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.oh b{font-size:15px}.oh small{color:var(--mut)}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.li img,.li .ph{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--g2);flex:none;display:grid;place-items:center;font-size:20px}
.nm{flex:1;min-width:0;font-size:14px}.nm small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.st{flex:none;font-size:12px;border-radius:999px;padding:4px 10px;font-weight:600;white-space:nowrap}
.st.wait{background:#eef2ff;color:#4338ca}.st.got{background:var(--g2);color:var(--g)}
.st.ask{background:#fff4e0;color:var(--amb)}.st.sent{background:#e0f2fe;color:#0369a1}
.st.refund{background:#fde8e8;color:var(--red)}
.x{text-decoration:line-through;opacity:.6}
.msg{text-align:center;color:var(--mut);padding:40px 10px}
.wa{display:block;text-align:center;background:var(--wa);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:13px;margin-top:6px}
.leg{font-size:12px;color:var(--mut);line-height:1.7}
.foot{text-align:center;font-size:12px;color:var(--mut);margin-top:16px}
.foot a{color:var(--g)}
</style>
</head>
<body>
<header><h1>🧾 ອໍເດີຂອງຂ້ອຍ</h1><p id="hs">ຮັບຫິ້ວ Olive Young 🇰🇷</p></header>
<main id="app"><div class="msg">ກຳລັງໂຫຼດ…</div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script>
const FBCFG={apiKey:"AIzaSyBpbY3mOUdiaXzC1BiOCe9mJVuJor6R-H8",authDomain:"preorder-augx.firebaseapp.com",projectId:"preorder-augx",storageBucket:"preorder-augx.firebasestorage.app",messagingSenderId:"236415572495",appId:"1:236415572495:web:3250af9d2eeebf395da17a"};
const STL={wait:"ລໍຖ້າຊື້",got:"ໄດ້ຂອງແລ້ວ",ask:"ລໍຖ້າຢືນຢັນ",sent:"ສົ່ງແລ້ວ",refund:"ຍົກເລີກ"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fm=v=>Math.round(+v||0).toLocaleString("en-US");
const kip=v=>fm(v)+" ₭";
const dstr=t=>{if(!t)return"";const d=new Date(t);return d.toLocaleDateString("lo-LA",{day:"numeric",month:"short",year:"numeric"})};
let WA="";
function waUrl(t){let d=String(WA).replace(/\D/g,"");if(!d)return"";if(d.startsWith("0"))d=d.slice(1);if(!d.startsWith("856"))d="856"+d;return`https://wa.me/${d}?text=${encodeURIComponent(t)}`}
function fail(m){$("#app").innerHTML=`<div class="card msg">${m}</div>`}
function draw(T){
  const b=T.bal||0;
  $("#hs").textContent=`ສະບາຍດີ ${T.nm} 👋 · ອັບເດດ ${dstr(T.up)}`;
  const O=T.orders||[];
  const cnt=O.reduce((a,o)=>a+(o.items||[]).filter(i=>i.st!=="refund").reduce((x,i)=>x+(+i.q||0),0),0);
  let h=`<div class="card"><div class="sum">
    <div><span>ທັງໝົດ</span><b>${cnt} ຊິ້ນ</b></div>
    <div><span>ຍອດລວມ</span><b>${kip(T.total)}</b></div>
    <div><span>${b<0?"ຄ້າງຈ່າຍ":b>0?"ຈະຄືນໃຫ້":"ສະຖານະ"}</span><b class="${b<0?"owe":b>0?"rf":"ok"}">${b?kip(Math.abs(b)):"✓ ຈ່າຍຄົບ"}</b></div>
  </div></div>`;
  h+=O.map(o=>{
    const sub=(o.items||[]).reduce((a,i)=>a+(i.st==="refund"?0:(+i.s||0)*(+i.q||0)),0);
    return`<div class="card"><div class="oh"><b>📅 ${dstr(o.d)}</b><small>${kip(sub)}</small></div>
    ${(o.items||[]).map(i=>`<div class="li">${i.img?`<img src="${esc(i.img)}" alt="" loading="lazy">`:`<div class="ph">📦</div>`}
      <div class="nm ${i.st==="refund"?"x":""}">${esc(i.n)} × ${+i.q||0}<small>${kip((+i.s||0)*(+i.q||0))}${i.ns?` · ລາຄາໃໝ່ ${kip(i.ns)}/ຊິ້ນ`:""}</small></div>
      <span class="st ${esc(i.st)}">${STL[i.st]||esc(i.st)}</span></div>`).join("")}</div>`}).join("")||`<div class="card msg">ຍັງບໍ່ມີອໍເດີ</div>`;
  h+=`<div class="card leg">🟦 ລໍຖ້າຊື້ — ຮ້ານກຳລັງສັ່ງຊື້ຈາກເກົາຫຼີ<br>🟩 ໄດ້ຂອງແລ້ວ — ຂອງຮອດແລ້ວ ລໍຖ້າສົ່ງ/ນັດຮັບ<br>🟦 ສົ່ງແລ້ວ — ສົ່ງໃຫ້ທ່ານແລ້ວ<br>🟧 ລໍຖ້າຢືນຢັນ — ລາຄາປ່ຽນ ກະລຸນາຕອບຮ້ານ</div>`;
  const u=waUrl(`ສະບາຍດີ ຂ້ອຍ ${T.nm} ຢາກສອບຖາມກ່ຽວກັບອໍເດີ`);
  if(u)h+=`<a class="wa" href="${u}" target="_blank" rel="noopener">💬 ສອບຖາມຮ້ານທາງ WhatsApp</a>`;
  h+=`<div class="foot">ລິ້ງນີ້ເປັນຂອງທ່ານຄົນດຽວ ກະລຸນາຢ່າແບ່ງປັນ · <a href="./">ເບິ່ງສິນຄ້າ / ສັ່ງເພີ່ມ</a></div>`;
  $("#app").innerHTML=h;
}
(async()=>{
  const t=new URLSearchParams(location.search).get("t")||"";
  if(!/^[A-Za-z0-9_-]{20,40}$/.test(t))return fail("ລິ້ງບໍ່ຖືກຕ້ອງ<br>ກະລຸນາຂໍລິ້ງໃໝ່ຈາກຮ້ານ");
  try{
    firebase.initializeApp(FBCFG);const db=firebase.firestore();
    db.doc("settings/shop").get().then(d=>{if(d.exists)WA=d.data().wa||""}).catch(()=>{});
    db.doc("track/"+t).onSnapshot(d=>{if(!d.exists)return fail("ບໍ່ພົບຂໍ້ມູນ<br>ລິ້ງອາດຖືກປ່ຽນແລ້ວ ກະລຸນາຂໍລິ້ງໃໝ່ຈາກຮ້ານ");draw(d.data())},
      e=>fail("ໂຫຼດບໍ່ໄດ້ ("+esc(e.code)+")<br>ລອງໃໝ່ພາຍຫຼັງ"));
  }catch(e){fail("ໂຫຼດບໍ່ໄດ້ ລອງໃໝ່ພາຍຫຼັງ")}
})();
</script>
</body>
</html>
